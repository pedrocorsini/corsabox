spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.verification.secret=${APP_VERIFICATION_SECRET}
app.refresh-cookie.secure=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=${GOOGLE_SESSION_SAMESITE:lax}
server.forward-headers-strategy=none
