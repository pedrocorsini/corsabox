spring.application.name=corsabox
server.port=${PORT:8080}
spring.data.web.pageable.max-page-size=100

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:chave-apenas-para-desenvolvimento-32-bytes}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.sender-email=${MAIL_SENDER_EMAIL:}
app.mail.sender-name=CorsaBox
app.mail.api-key=${MAIL_API_KEY:}
spring.datasource.hikari.connection-timeout=10000
