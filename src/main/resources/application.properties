spring.application.name=corsabox
app.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m
server.port=${PORT:8080}
spring.data.web.pageable.max-page-size=100

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

app.jwt.secret=${APP_JWT_SECRET:chave-apenas-para-desenvolvimento-32-bytes}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.sender-email=${MAIL_SENDER_EMAIL:}
app.mail.sender-name=CorsaBox
app.mail.api-key=${MAIL_API_KEY:}
spring.datasource.hikari.connection-timeout=10000

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.token=${TMDB_TOKEN:}
app.tmdb.language=pt-BR

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.forward-headers-strategy=native
app.rate-limit.enabled=true

app.verification.secret=${APP_VERIFICATION_SECRET:codigo-apenas-para-desenvolvimento-32-bytes}

app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=30
app.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.refresh-cookie.same-site=${REFRESH_COOKIE_SAMESITE:Lax}
