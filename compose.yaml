services:
  corsabox-database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: corsabox
      POSTGRES_USER: corsabox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corsabox}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - corsabox-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsabox -d corsabox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corsabox-data: